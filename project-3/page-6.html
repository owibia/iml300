<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Involvement</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
      }

      .container {
        display: flex;
        position: relative;
        width: 100%;
        margin: auto;
      }

      img {
        width: 100%;
        display: block;
      }

      .frame-1,
      .frame-2,
      .frame-3 {
        position: absolute;
        width: 500px;
      }

      .frame-1 {
        bottom: 150px;
        right: 150px;
      }
      .frame-2 {
        top: 80px;
        left: 730px;
      }
      .frame-3 {
        top: 400px;
        left: 200px;
      }

      iframe {
        width: 500px;
        height: 300px;
      }

      .handle {
        width: 100%;
        height: 40px;
        background: #0007d0;
        color: white;
        cursor: move;
        text-align: center;
        font-family: sans-serif;
        line-height: 40px;
        font-size: 20px;
      }

      button {
        position: absolute;
        bottom: 50px;
        right: 80px;
        width: 80px;
        height: 30px;
        font-size: 15px;
        background: #0007d0;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="assets/a-current.png" />
      <div class="frame-1">
        <div class="handle">Asian Americans Advancing Justice</div>
        <iframe src="https://ajsocal.org/" frameborder="0"></iframe>
      </div>
      <div class="frame-2">
        <div class="handle">AAPI LA</div>
        <iframe src="https://aapila.org/" frameborder="0"></iframe>
      </div>
      <div class="frame-3">
        <div class="handle">PBS SoCal</div>
        <iframe
          src="https://www.pbssocal.org/our-aapi-community"
          frameborder="0"
        ></iframe>
      </div>
      <a href="index.html"><button>Back</button></a>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
    <script>
      $(function () {
        $(".frame-1, .frame-2, .frame-3").draggable({
          handle: ".handle",
          iframeFix: true,
        });
      });
    </script>
  </body>
</html>

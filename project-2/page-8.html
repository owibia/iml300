<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="13; eating.html" />
    <link rel="stylesheet" href="style-4.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        margin: 10px 0;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        border-right: 0.15em solid transparent;
        animation-fill-mode: both;
      }

      .line-1 {
        --w: 8ch;
        animation:
          typing 1.5s steps(8) 0s both,
          blink-caret 0.75s step-end 0s infinite,
          hide-caret 0s forwards 2s;
      }

      .line-2 {
        --w: 41ch;
        animation:
          typing 2.5s steps(41) 2s both,
          blink-caret 0.75s step-end 2s infinite,
          hide-caret 0s forwards 4.5s;
      }

      .line-3 {
        --w: 19ch;
        animation:
          typing 2s steps(19) 5s both,
          blink-caret 0.75s step-end 5s infinite,
          hide-caret 0s forwards 7.5s;
      }

      .line-4 {
        --w: 16ch;
        animation:
          typing 2s steps(16) 7s both,
          blink-caret 0.75s step-end 7s infinite,
          hide-caret 0s forwards 9.5s;
        transition: width 0.3s ease;
      }

      .line-5 {
        --w: 11ch;
        animation:
          typing 2s steps(11) 9s both,
          blink-caret 0.75s step-end 9s infinite;
        transition: width 0.3s ease;
      }

      @keyframes typing {
        0% {
          width: 0;
          border-color: transparent;
        }
        0.1% {
          width: 0;
          border-color: white;
        }
        100% {
          width: var(--w);
          border-color: white;
        }
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: white;
        }
      }

      @keyframes hide-caret {
        to {
          border-right: none;
          border-color: transparent;
        }
      }
    </style>
    <title>text-2</title>
  </head>
  <body>
    <div class="texts">
      <p class="line-1">THEM: hey</p>
      <p class="line-2">
        YOU: hi sorry about today
        <span style="color: red"> i guess i overslept haha</span>
      </p>
      <p class="line-3">THEM: nws, next week?</p>
      <p class="line-4">YOU: yesss, dinner?</p>
      <p class="line-5">THEM: sure :)</p>
    </div>
  </body>
</html>

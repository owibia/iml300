<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-4.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        margin: 10px 0;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        border-right: 0.15em solid transparent;
        animation-fill-mode: both;
      }

      .line-1 {
        --w: 11ch;
        animation:
          typing 1.5s steps(11) 0s both,
          blink-caret 0.75s step-end 0s infinite,
          hide-caret 0s forwards 4.5s;
      }

      .line-2 {
        --w: 47ch;
        animation:
          typing 4s steps(47) 5s both,
          blink-caret 0.75s step-end 4.5s infinite,
          hide-caret 0s forwards 12s;
      }

      .line-3 {
        --w: 23ch;
        animation:
          typing 3s steps(23) 12s both,
          blink-caret 0.75s step-end 11.5s infinite,
          hide-caret 0s forwards 18s;
      }

      .line-4 {
        --w: 17ch;
        animation:
          typing 4s steps(17) 18s both,
          blink-caret 0.75s step-end 17.5s infinite;
      }

      @keyframes typing {
        0% {
          width: 0;
          border-color: transparent;
        }
        0.1% {
          width: 0;
          border-color: white;
        }
        100% {
          width: var(--w);
          border-color: white;
        }
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: white;
        }
      }

      @keyframes hide-caret {
        to {
          border-right: none;
          border-color: transparent;
        }
      }
    </style>
    <title>text-3</title>
  </head>
  <body>
    <div class="texts">
      <p class="line-1">YOU: heyyy :-)</p>
      <p class="line-2" style="margin-top: 40px">
        YOU: hi i know its been a while but i hope you're doing well!
      </p>
      <p class="line-3" style="margin-top: 40px">YOU: heyyy just checking in</p>
      <p class="line-4" style="margin-top: 40px">
        YOU: <a href="index.html" style="color: red">i really miss you</a>
      </p>
    </div>
  </body>
</html>

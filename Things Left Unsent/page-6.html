<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-4.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        margin: 10px 0;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        border-right: 0.15em solid transparent;
        animation-fill-mode: both;
      }

      .line-1 {
        --w: 11ch;
        animation:
          typing 1.5s steps(11) 0s both,
          blink-caret 0.75s step-end 0s infinite,
          hide-caret 0s forwards 1.5s;
      }

      .line-2 {
        --w: 12ch;
        animation:
          typing 1.5s steps(12) 2s both,
          blink-caret 0.75s step-end 2s infinite,
          hide-caret 0s forwards 3.5s;
      }

      .line-3 {
        --w: 36ch;
        animation:
          typing 3s steps(36) 3.5s both,
          blink-caret 0.75s step-end 3.5s infinite,
          hide-caret 0s forwards 6.5s;
      }

      .line-4 {
        --w: 11ch;
        animation:
          typing 1s steps(11) 6.8s both,
          blink-caret 0.75s step-end 6.8s infinite;
        transition: width 0.3s ease;
      }

      @keyframes typing {
        0% {
          width: 0;
          border-color: transparent;
        }
        0.1% {
          width: 0;
          border-color: white;
        }
        100% {
          width: var(--w);
          border-color: white;
        }
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: white;
        }
      }

      @keyframes hide-caret {
        to {
          border-right: none;
          border-color: transparent;
        }
      }
    </style>
    <title>text-1</title>
  </head>
  <body>
    <div class="texts">
      <p class="line-1">THEM: heyyy</p>
      <p class="line-2">YOU: heyyy :-)</p>
      <p class="line-3">THEM: we're still on for tomorrow right?</p>
      <p class="line-4">YOU: <span class="lie">yes ofc!</span></p>
    </div>
    <script>
      // Start of AI code
      const target = document.querySelector(".lie");

      target.addEventListener(
        "mouseenter",
        () => {
          const newText =
            "honestly, i've been feeling really tired recently and it's been hard to get out of bed.";

          target.innerHTML = newText;

          target.classList.add("corrupted");

          const parentP = target.closest("p");
          parentP.style.width = "auto";
          parentP.style.whiteSpace = "normal";
          parentP.style.borderRight = "none";
          parentP.style.animation = "none";

          setTimeout(() => {
            window.location.href = "train.html";
          }, 3000);
        },
        { once: true },
      );

      // End of AI Code
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-3.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Nostalgia</title>
  </head>
  <body>
    <div class="pixel">
      <p class="time">It's 3:33 A.M. You can't seem to fall asleep.</p>
      <p class="thoughts">
        Instead, your head is filled with memories of
        <span class="glitch" data-text="them">them</span>
      </p>
    </div>
    <div class="all-buttons">
      <a href="index-2.html" style="color: black">
        <button class="circle-button">indulge</button>
      </a>
      <button class="circle-button" id="run">resist</button>
    </div>
    <script>
      window.addEventListener("load", () => {
        const container = document.querySelector(".all-buttons");

        setTimeout(() => {
          container.classList.add("show-button");
        }, 4300);
      });

      // start of AI code

      let posX = 0,
        posY = 0;
      let velX = 0,
        velY = 0;
      const friction = 0.92;
      const strength = 0.01;

      function update() {
        velX *= friction;
        velY *= friction;
        posX += velX;
        posY += velY;

        const runBtn = document.getElementById("run");
        runBtn.style.transform = `translate(${posX}px, ${posY}px)`;

        requestAnimationFrame(update);
      }

      update();

      document.addEventListener("mousemove", (e) => {
        const runBtn = document.getElementById("run");
        const rect = runBtn.getBoundingClientRect();
        const btnCenterX = rect.left + rect.width / 2;
        const btnCenterY = rect.top + rect.height / 2;

        const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

        if (dist < 50) {
          const angle = Math.atan2(
            btnCenterY - e.clientY,
            btnCenterX - e.clientX,
          );
          const force = (150 - dist) * strength;

          velX += Math.cos(angle) * force;
          velY += Math.sin(angle) * force;
        }
      });

      // End of AI code
    </script>
  </body>
</html>
